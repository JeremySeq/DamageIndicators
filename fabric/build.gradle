plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    shadowBundle 'com.electronwill.night-config:toml:3.6.0'
    shadowBundle 'com.electronwill.night-config:core:3.6.0'

    common(project(path: ':common')) {
        transitive = false
    }

    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    def propsFile = rootProject.file('gradle.properties')
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }

    inputs.property 'version', project.version
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand(props + [version: project.version])
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
